name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only reads the checkout.
permissions:
  contents: read

# A newer push to the same ref makes the in-flight run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Formatting
        run: npm run format:check

      # --ci exits non-zero on any warning, so a missing description or an
      # unresolved bundle member fails here instead of reaching the marketplace.
      - name: Build the store
        run: npm run build:ci

      # The build is deterministic, so a dirty tree means someone hand-edited
      # generated output or forgot to commit a rebuild. README's item table is
      # generated too, so a new skill with no README row fails here.
      - name: Generated output is committed and current
        run: git diff --exit-code -- plugins/ .claude-plugin/ README.md
